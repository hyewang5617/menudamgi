<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문하기 - 메뉴담기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>점심 주문하기</h1>
            <button class="btn btn-small" onclick="location.href='index.html'">처음으로</button>
        </header>

        <main id="orderMain">
            <div id="loading" class="loading">
                <p>주문 정보를 불러오는 중입니다...</p>
            </div>

            <div id="notFound" class="error-box" style="display: none;">
                <h2>주문 세션을 찾을 수 없습니다</h2>
                <p>올바른 주문 링크인지 다시 확인해 주세요.</p>
                <button class="btn btn-primary" onclick="location.href='index.html'">처음으로</button>
            </div>

            <div id="expired" class="error-box" style="display: none;">
                <h2>주문이 마감되었습니다</h2>
                <p>마감 시간이 지나 더 이상 주문할 수 없어요.</p>
                <button class="btn btn-primary" onclick="location.href='index.html'">처음으로</button>
            </div>

            <div id="nameStep" style="display: none;">
                <div class="session-info card">
                    <h2 id="sessionTitleName"></h2>
                    <p class="restaurant" id="restaurantNameStep"></p>
                    <p class="deadline" id="deadlineInfoStep"></p>
                </div>

                <div class="card" style="text-align: center;">
                    <h3>주문자 이름</h3>
                    <p style="margin-bottom: 24px;">주문 시작 전에 이름을 입력해 주세요.</p>
                    <div class="form-group">
                        <input type="text" id="userNameInput" placeholder="이름을 입력하세요" style="font-size: 1.2rem; text-align: center;">
                    </div>
                    <button class="btn btn-primary btn-large" onclick="startOrder()">
                        메뉴 고르기
                    </button>
                </div>
            </div>

            <div id="orderForm" style="display: none;">
                <div class="session-info card">
                    <h2 id="sessionTitle"></h2>
                    <p class="restaurant" id="restaurantName"></p>
                    <p class="deadline" id="deadlineInfo"></p>
                    <div style="margin-top: 12px; padding: 12px; background: rgba(255,255,255,0.2); border-radius: 8px;">
                        <strong>주문자: <span id="currentUserName"></span></strong>
                    </div>
                </div>

                <div class="card">
                    <h3>메뉴 선택</h3>
                    <p class="hint">수량을 1개 이상 올리면 아래에 옵션 선택 단락이 펼쳐집니다.</p>
                    <div id="menuList" class="menu-list"></div>
                </div>

                <div class="card">
                    <h3>주문 요약</h3>
                    <div id="orderSummary" class="order-summary">
                        <p class="empty">아직 선택한 메뉴가 없습니다</p>
                    </div>
                    <div class="total-price">
                        <span>총 금액</span>
                        <span id="totalPrice">0원</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>요청사항</label>
                    <textarea id="orderNote" rows="3" placeholder="예: 수저 빼주세요, 음료는 얼음 적게 주세요"></textarea>
                </div>

                <button class="btn btn-primary btn-large" onclick="submitOrder()">
                    주문 완료하기
                </button>

                <div class="info-box">
                    <p><strong>현재 주문 인원: <span id="currentOrderCount">0</span>명</strong></p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import {
            getSession,
            findOrderByUserName,
            updateOrderInSession
        } from './firebase.js';

        let currentSession = null;
        let selectedItems = {};
        let selectedOptions = {};
        let currentUserName = '';
        let existingOrder = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');

            if (!sessionId) {
                showNotFound();
                return;
            }

            const session = await getSession(sessionId);
            if (!session) {
                showNotFound();
                return;
            }

            const deadline = new Date(session.deadline);
            if (deadline < new Date()) {
                showExpired();
                return;
            }

            currentSession = session;
            displayNameStep();
        });

        function showNotFound() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('notFound').style.display = 'block';
        }

        function showExpired() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('expired').style.display = 'block';
        }

        function displayNameStep() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('nameStep').style.display = 'block';

            document.getElementById('sessionTitleName').textContent = currentSession.name;
            document.getElementById('restaurantNameStep').textContent = `식당: ${currentSession.restaurant}`;
            document.getElementById('deadlineInfoStep').textContent = `마감: ${new Date(currentSession.deadline).toLocaleString('ko-KR')}`;

            document.getElementById('userNameInput').addEventListener('keypress', (event) => {
                if (event.key === 'Enter') {
                    startOrder();
                }
            });
        }

        async function startOrder() {
            const userName = document.getElementById('userNameInput').value.trim();

            if (!userName) {
                alert('이름을 입력해 주세요.');
                document.getElementById('userNameInput').focus();
                return;
            }

            currentUserName = userName;
            existingOrder = await findOrderByUserName(currentSession.id, userName);

            if (existingOrder) {
                const shouldLoadExisting = window.confirm(
                    `'${userName}' 이름으로 기존 주문이 있습니다.\n\n기존 주문을 불러와서 수정할까요?\n\n[확인] 기존 주문 수정\n[취소] 새로 주문`
                );

                if (!shouldLoadExisting) {
                    existingOrder = null;
                }
            }

            document.getElementById('nameStep').style.display = 'none';
            displayOrderForm();
        }

        function displayOrderForm() {
            document.getElementById('orderForm').style.display = 'block';
            document.getElementById('sessionTitle').textContent = currentSession.name;
            document.getElementById('restaurantName').textContent = `식당: ${currentSession.restaurant}`;
            document.getElementById('currentUserName').textContent = currentUserName;
            document.getElementById('deadlineInfo').textContent = `마감: ${new Date(currentSession.deadline).toLocaleString('ko-KR')}`;
            document.getElementById('currentOrderCount').textContent = currentSession.orders.length;

            displayMenuList();

            if (existingOrder) {
                loadExistingOrder();
            } else {
                updateOrderSummary();
            }
        }

        function getMenuItem(menuId) {
            return currentSession.menu.find(item => String(item.id) === String(menuId));
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getSelectedChoiceIds(menuId, groupId) {
            return selectedOptions[menuId]?.[groupId] || [];
        }

        function renderOptionGroups(menuItem) {
            const groups = menuItem.options || [];
            if (groups.length === 0) {
                return '';
            }

            return `
                <div id="options-${menuItem.id}" class="menu-options-panel">
                    ${groups.map(group => `
                        <div class="option-group">
                            <div class="option-group-title">
                                <span>${escapeHtml(group.name)}</span>
                                <span class="option-group-meta">${group.type === 'multiple' ? '복수 선택' : '1개 선택'}${group.required ? ' · 필수' : ''}</span>
                            </div>
                            <div class="option-choice-list">
                                ${(group.choices || []).map(choice => {
                                    const inputType = group.type === 'multiple' ? 'checkbox' : 'radio';
                                    return `
                                        <label class="option-choice">
                                            <input
                                                type="${inputType}"
                                                name="option-${menuItem.id}-${group.id}"
                                                value="${choice.id}"
                                                onchange="toggleOptionSelection('${menuItem.id}', '${group.id}', '${choice.id}', '${group.type}')"
                                            >
                                            <span>${escapeHtml(choice.name)}</span>
                                            <span class="option-choice-price">${choice.price > 0 ? `+${choice.price.toLocaleString()}원` : '추가금액 없음'}</span>
                                        </label>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function displayMenuList() {
            const menuList = document.getElementById('menuList');
            const sortedMenu = [...currentSession.menu].sort((a, b) => b.price - a.price);

            menuList.innerHTML = sortedMenu.map(item => `
                <div class="menu-item" id="menu-card-${item.id}">
                    <div class="menu-item-main">
                        <div class="menu-info">
                            <span class="menu-name">${escapeHtml(item.name)}</span>
                            <span class="menu-price">${item.price.toLocaleString()}원</span>
                        </div>
                        <div class="quantity-control">
                            <button class="qty-btn" onclick="changeQuantity('${item.id}', -1)">-</button>
                            <input
                                type="number"
                                id="qty-${item.id}"
                                value="${selectedItems[item.id] || 0}"
                                min="0"
                                class="qty-input"
                                onchange="updateQuantity('${item.id}', this.value)"
                            >
                            <button class="qty-btn" onclick="changeQuantity('${item.id}', 1)">+</button>
                        </div>
                    </div>
                    ${renderOptionGroups(item)}
                </div>
            `).join('');

            syncOptionInputs();
        }

        function loadExistingOrder() {
            existingOrder.items.forEach(item => {
                selectedItems[item.menuId] = item.quantity;
                selectedOptions[item.menuId] = {};

                (item.selectedOptions || []).forEach(group => {
                    selectedOptions[item.menuId][group.groupId] = group.choiceIds || [];
                });

                const input = document.getElementById(`qty-${item.menuId}`);
                if (input) {
                    input.value = item.quantity;
                }
            });

            if (existingOrder.note) {
                document.getElementById('orderNote').value = existingOrder.note;
            }

            syncOptionInputs();
            updateOrderSummary();
        }

        function changeQuantity(menuId, delta) {
            const input = document.getElementById(`qty-${menuId}`);
            const newValue = Math.max(0, parseInt(input.value || 0, 10) + delta);
            input.value = newValue;
            updateQuantity(menuId, newValue);
        }

        function updateQuantity(menuId, quantity) {
            const nextQuantity = Math.max(0, parseInt(quantity || 0, 10));

            if (nextQuantity > 0) {
                selectedItems[menuId] = nextQuantity;
            } else {
                delete selectedItems[menuId];
                delete selectedOptions[menuId];
            }

            syncOptionPanel(menuId);
            updateOrderSummary();
        }

        function syncOptionPanel(menuId) {
            const panel = document.getElementById(`options-${menuId}`);
            const card = document.getElementById(`menu-card-${menuId}`);
            const isOpen = (selectedItems[menuId] || 0) > 0;

            if (panel) {
                panel.classList.toggle('is-open', isOpen);
            }

            if (card) {
                card.classList.toggle('is-active', isOpen);
            }
        }

        function syncOptionInputs() {
            currentSession.menu.forEach(item => syncOptionPanel(item.id));

            Object.entries(selectedOptions).forEach(([menuId, groupMap]) => {
                Object.entries(groupMap).forEach(([groupId, choiceIds]) => {
                    document.querySelectorAll(`input[name="option-${menuId}-${groupId}"]`).forEach(input => {
                        input.checked = choiceIds.includes(input.value);
                    });
                });
            });
        }

        function toggleOptionSelection(menuId, groupId, choiceId, groupType) {
            if (!selectedOptions[menuId]) {
                selectedOptions[menuId] = {};
            }

            const currentChoiceIds = getSelectedChoiceIds(menuId, groupId);

            if (groupType === 'multiple') {
                selectedOptions[menuId][groupId] = currentChoiceIds.includes(choiceId)
                    ? currentChoiceIds.filter(id => id !== choiceId)
                    : [...currentChoiceIds, choiceId];
            } else {
                selectedOptions[menuId][groupId] = [choiceId];
            }

            updateOrderSummary();
        }

        function collectMenuOptionSelection(menuItem) {
            const groupSelections = [];
            let optionUnitPrice = 0;

            (menuItem.options || []).forEach(group => {
                const selectedIds = getSelectedChoiceIds(menuItem.id, group.id);
                const selectedChoices = (group.choices || []).filter(choice => selectedIds.includes(choice.id));

                if (selectedChoices.length === 0) {
                    return;
                }

                const extra = selectedChoices.reduce((sum, choice) => sum + (choice.price || 0), 0);
                optionUnitPrice += extra;
                groupSelections.push({
                    groupId: group.id,
                    groupName: group.name,
                    choiceIds: selectedChoices.map(choice => choice.id),
                    choices: selectedChoices.map(choice => ({
                        id: choice.id,
                        name: choice.name,
                        price: choice.price || 0
                    }))
                });
            });

            return { groupSelections, optionUnitPrice };
        }

        function formatSelectedOptions(groupSelections) {
            return groupSelections.map(group => `${group.groupName}: ${group.choices.map(choice => choice.name).join(', ')}`);
        }

        function validateRequiredOptions() {
            for (const menuId of Object.keys(selectedItems)) {
                const menuItem = getMenuItem(menuId);
                if (!menuItem) continue;

                for (const group of (menuItem.options || [])) {
                    if (!group.required) continue;

                    if (getSelectedChoiceIds(menuId, group.id).length === 0) {
                        alert(`${menuItem.name}의 "${group.name}" 옵션을 선택해 주세요.`);
                        return false;
                    }
                }
            }

            return true;
        }

        function updateOrderSummary() {
            const summaryDiv = document.getElementById('orderSummary');
            const totalPriceSpan = document.getElementById('totalPrice');
            const menuIds = Object.keys(selectedItems);

            if (menuIds.length === 0) {
                summaryDiv.innerHTML = '<p class="empty">아직 선택한 메뉴가 없습니다</p>';
                totalPriceSpan.textContent = '0원';
                return;
            }

            let total = 0;
            let html = '<div class="summary-items">';

            menuIds.forEach(menuId => {
                const quantity = selectedItems[menuId];
                const menuItem = getMenuItem(menuId);
                if (!menuItem) return;

                const { groupSelections, optionUnitPrice } = collectMenuOptionSelection(menuItem);
                const unitPrice = menuItem.price + optionUnitPrice;
                const lineTotal = unitPrice * quantity;
                total += lineTotal;

                html += `
                    <div class="summary-item">
                        <div class="summary-item-main">
                            <span>${escapeHtml(menuItem.name)} x ${quantity}</span>
                            <span>${lineTotal.toLocaleString()}원</span>
                        </div>
                        ${groupSelections.length > 0 ? `<div class="summary-item-options">${escapeHtml(formatSelectedOptions(groupSelections).join(' / '))}</div>` : ''}
                    </div>
                `;
            });

            html += '</div>';
            summaryDiv.innerHTML = html;
            totalPriceSpan.textContent = `${total.toLocaleString()}원`;
        }

        async function submitOrder() {
            const orderNote = document.getElementById('orderNote').value.trim();

            if (Object.keys(selectedItems).length === 0 && !orderNote) {
                alert('메뉴를 선택하거나 요청사항을 입력해 주세요.');
                return;
            }

            if (!validateRequiredOptions()) {
                return;
            }

            const orderItems = [];
            let totalPrice = 0;

            Object.keys(selectedItems).forEach(menuId => {
                const quantity = selectedItems[menuId];
                const menuItem = getMenuItem(menuId);
                if (!menuItem) return;

                const { groupSelections, optionUnitPrice } = collectMenuOptionSelection(menuItem);
                const unitPrice = menuItem.price + optionUnitPrice;
                const lineTotal = unitPrice * quantity;

                orderItems.push({
                    menuId,
                    menuName: menuItem.name,
                    price: menuItem.price,
                    optionUnitPrice,
                    unitPrice,
                    quantity,
                    selectedOptions: groupSelections
                });

                totalPrice += lineTotal;
            });

            const order = {
                id: existingOrder ? existingOrder.id : Date.now() + Math.random(),
                userName: currentUserName,
                items: orderItems,
                totalPrice,
                note: orderNote,
                timestamp: new Date().toISOString()
            };

            await updateOrderInSession(currentSession.id, currentUserName, order);

            const actionText = existingOrder ? '수정되었습니다' : '완료되었습니다';
            alert(`주문이 ${actionText}.\n\n주문자: ${currentUserName}\n총 금액: ${totalPrice.toLocaleString()}원`);

            document.getElementById('orderNote').value = '';
            selectedItems = {};
            selectedOptions = {};
            existingOrder = null;
            displayMenuList();
            updateOrderSummary();

            const updatedSession = await getSession(currentSession.id);
            if (updatedSession) {
                currentSession = updatedSession;
                document.getElementById('currentOrderCount').textContent = updatedSession.orders.length;
            }
        }

        window.startOrder = startOrder;
        window.submitOrder = submitOrder;
        window.changeQuantity = changeQuantity;
        window.toggleOptionSelection = toggleOptionSelection;
    </script>
</body>
</html>
