<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 메뉴담기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>관리자 페이지</h1>
            <button class="btn btn-small" onclick="location.href='index.html'">처음으로</button>
        </header>

        <main>
            <div class="card">
                <h2>주문 세션 만들기</h2>

                <div class="form-group">
                    <label>세션 이름</label>
                    <input type="text" id="sessionName" placeholder="예: 오늘 점심, 팀 회식">
                </div>

                <div class="form-group">
                    <label>식당 이름</label>
                    <input type="text" id="restaurantName" placeholder="예: 맘스터치, 교촌치킨">
                </div>

                <div class="form-group">
                    <label>마감 시간</label>
                    <input type="datetime-local" id="deadline">
                </div>

                <div class="form-group">
                    <label>메뉴 입력</label>
                    <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
                        <button type="button" class="btn btn-small btn-secondary" onclick="showTemplateModal()">템플릿 불러오기</button>
                        <button type="button" class="btn btn-small btn-secondary" onclick="showPreviousMenus()">이전 메뉴 불러오기</button>
                        <button type="button" class="btn btn-small btn-secondary" onclick="saveAsTemplate()">템플릿 저장</button>
                        <button type="button" class="btn btn-small btn-secondary" onclick="smartParse()">자동 파싱</button>
                    </div>
                    <p class="hint">한 줄에 하나씩 `메뉴명|가격` 형식으로 입력하세요.</p>
                    <textarea id="menuInput" rows="10" placeholder="싸이버거|5900&#10;치즈버거|5200&#10;감자튀김|2500"></textarea>
                </div>

                <div class="form-group">
                    <label>메뉴 미리보기</label>
                    <div id="menuPreview" class="menu-preview">
                        <p class="empty">메뉴를 입력하면 미리보기가 표시됩니다.</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>메뉴 옵션 설정</label>
                    <p class="hint">사용자가 메뉴를 고르면 아래에 펼쳐질 옵션 그룹을 메뉴별로 추가할 수 있어요.</p>
                    <div id="menuOptionEditor" class="menu-option-editor">
                        <p class="empty">메뉴를 먼저 입력해 주세요.</p>
                    </div>
                </div>

                <button class="btn btn-primary btn-large" onclick="createSession()">주문 세션 생성</button>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;">
                    <h2 style="margin: 0;">주문 세션 목록</h2>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button type="button" class="btn btn-small btn-secondary" onclick="exportData()">데이터 백업</button>
                        <button type="button" class="btn btn-small btn-secondary" onclick="document.getElementById('importFile').click()">데이터 복원</button>
                        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
                    </div>
                </div>
                <div id="sessionList"></div>
            </div>
        </main>
    </div>

    <div id="menuModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">메뉴 선택</h3>
                <button class="modal-close" onclick="closeMenuModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script type="module">
        import {
            generateSessionCode,
            getAllSessions,
            getSession,
            saveSession,
            getAllTemplates,
            saveTemplate,
            deleteTemplate
        } from './firebase.js';

        let menuOptionDrafts = {};

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeForInline(value) {
            return value.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function parseMenuLines(menuText) {
            return menuText
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean)
                .map(line => {
                    const parts = line.split('|');
                    if (parts.length !== 2) return null;

                    const name = parts[0].trim();
                    const price = parseInt(parts[1].replace(/,/g, '').trim(), 10);

                    if (!name || Number.isNaN(price)) return null;
                    return { name, price };
                })
                .filter(Boolean);
        }

        function createEmptyOptionGroup() {
            return {
                id: `${Date.now()}-${Math.random()}`,
                name: '',
                type: 'single',
                required: false,
                choicesText: ''
            };
        }

        function buildMenuOptions(menuName) {
            return (menuOptionDrafts[menuName] || [])
                .map(group => {
                    const choices = group.choicesText
                        .split('\n')
                        .map(line => line.trim())
                        .filter(Boolean)
                        .map(line => {
                            const [choiceNameRaw, choicePriceRaw = '0'] = line.split('|');
                            const choiceName = choiceNameRaw?.trim();
                            const choicePrice = parseInt(choicePriceRaw.replace(/,/g, '').trim(), 10);

                            if (!choiceName || Number.isNaN(choicePrice)) {
                                return null;
                            }

                            return {
                                id: `${group.id}-${choiceName}`,
                                name: choiceName,
                                price: choicePrice
                            };
                        })
                        .filter(Boolean);

                    if (!group.name.trim() || choices.length === 0) {
                        return null;
                    }

                    return {
                        id: `${menuName}-${group.id}`,
                        name: group.name.trim(),
                        type: group.type === 'multiple' ? 'multiple' : 'single',
                        required: Boolean(group.required),
                        choices
                    };
                })
                .filter(Boolean);
        }

        function hydrateOptionDraftsFromMenu(menuItems) {
            const nextDrafts = {};

            menuItems.forEach(item => {
                nextDrafts[item.name] = (item.options || []).map(group => ({
                    id: group.id || `${Date.now()}-${Math.random()}`,
                    name: group.name || '',
                    type: group.type === 'multiple' ? 'multiple' : 'single',
                    required: Boolean(group.required),
                    choicesText: (group.choices || []).map(choice => `${choice.name}|${choice.price || 0}`).join('\n')
                }));
            });

            menuOptionDrafts = nextDrafts;
        }

        function syncMenuOptionDrafts(menuItems) {
            const nextDrafts = {};
            menuItems.forEach(item => {
                nextDrafts[item.name] = menuOptionDrafts[item.name] || [];
            });
            menuOptionDrafts = nextDrafts;
        }

        function renderMenuPreview(menuItems) {
            const preview = document.getElementById('menuPreview');

            if (menuItems.length === 0) {
                preview.innerHTML = '<p class="empty">메뉴를 입력하면 미리보기가 표시됩니다.</p>';
                return;
            }

            const sortedMenu = [...menuItems].sort((a, b) => b.price - a.price);
            preview.innerHTML = `
                <div class="menu-grid">
                    ${sortedMenu.map(item => {
                        const optionCount = buildMenuOptions(item.name).length;
                        return `
                            <div class="menu-item-preview">
                                <div>
                                    <span class="menu-name">${escapeHtml(item.name)}</span>
                                    ${optionCount > 0 ? `<div class="menu-option-badge">${optionCount} option group(s)</div>` : ''}
                                </div>
                                <span class="menu-price">${item.price.toLocaleString()} KRW</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function renderMenuOptionEditor(menuItems) {
            const editor = document.getElementById('menuOptionEditor');

            if (menuItems.length === 0) {
                editor.innerHTML = '<p class="empty">메뉴를 먼저 입력해 주세요.</p>';
                return;
            }

            editor.innerHTML = menuItems.map(item => {
                const groups = menuOptionDrafts[item.name] || [];
                const inlineName = escapeForInline(item.name);

                return `
                    <div class="menu-option-card">
                        <div class="menu-option-card-header">
                            <div>
                                <strong>${escapeHtml(item.name)}</strong>
                                <p>${item.price.toLocaleString()} KRW</p>
                            </div>
                            <button type="button" class="btn btn-small btn-secondary" onclick="addOptionGroup('${inlineName}')">Add group</button>
                        </div>
                        <div class="menu-option-group-list">
                            ${groups.length === 0 ? '<p class="empty option-empty">No options yet.</p>' : groups.map(group => `
                                <div class="menu-option-group">
                                    <div class="menu-option-group-toolbar">
                                        <strong>Option group</strong>
                                        <button type="button" class="btn btn-small" onclick="removeOptionGroup('${inlineName}', '${group.id}')">Remove</button>
                                    </div>
                                    <div class="menu-option-fields">
                                        <input type="text" value="${escapeHtml(group.name)}" placeholder="e.g. Spice, Topping, Side" oninput="updateOptionGroupField('${inlineName}', '${group.id}', 'name', this.value)">
                                        <select onchange="updateOptionGroupField('${inlineName}', '${group.id}', 'type', this.value)">
                                            <option value="single" ${group.type === 'single' ? 'selected' : ''}>Single select</option>
                                            <option value="multiple" ${group.type === 'multiple' ? 'selected' : ''}>Multi select</option>
                                        </select>
                                        <label class="option-checkbox">
                                            <input type="checkbox" ${group.required ? 'checked' : ''} onchange="updateOptionGroupField('${inlineName}', '${group.id}', 'required', this.checked)">
                                            Required
                                        </label>
                                    </div>
                                    <textarea rows="4" placeholder="One choice per line&#10;Regular|0&#10;Extra Cheese|500" oninput="updateOptionGroupField('${inlineName}', '${group.id}', 'choicesText', this.value)">${escapeHtml(group.choicesText)}</textarea>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function refreshMenuBuilder() {
            const menuItems = parseMenuLines(document.getElementById('menuInput').value);
            syncMenuOptionDrafts(menuItems);
            renderMenuPreview(menuItems);
            renderMenuOptionEditor(menuItems);
        }

        function addOptionGroup(menuName) {
            if (!menuOptionDrafts[menuName]) {
                menuOptionDrafts[menuName] = [];
            }

            menuOptionDrafts[menuName].push(createEmptyOptionGroup());
            refreshMenuBuilder();
        }

        function removeOptionGroup(menuName, groupId) {
            menuOptionDrafts[menuName] = (menuOptionDrafts[menuName] || []).filter(group => group.id !== groupId);
            refreshMenuBuilder();
        }

        function updateOptionGroupField(menuName, groupId, field, value) {
            const group = (menuOptionDrafts[menuName] || []).find(item => item.id === groupId);
            if (!group) return;

            group[field] = value;
            renderMenuPreview(parseMenuLines(document.getElementById('menuInput').value));
        }

        function smartParse() {
            const input = document.getElementById('menuInput').value.trim();
            if (!input) {
                alert('메뉴 텍스트를 먼저 입력해 주세요.');
                return;
            }

            const parsed = input
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean)
                .map(line => {
                    if (line.includes('|')) {
                        return line;
                    }

                    const patterns = [
                        /^(.+?)\s+([0-9,]+)원?$/,
                        /^(.+?)\s*[:\-]\s*([0-9,]+)원?$/
                    ];

                    for (const pattern of patterns) {
                        const match = line.match(pattern);
                        if (match) {
                            return `${match[1].trim()}|${match[2].replace(/,/g, '')}`;
                        }
                    }

                    return null;
                })
                .filter(Boolean);

            if (parsed.length === 0) {
                alert('파싱할 수 있는 메뉴를 찾지 못했습니다.');
                return;
            }

            document.getElementById('menuInput').value = parsed.join('\n');
            refreshMenuBuilder();
            alert(`${parsed.length}개 메뉴를 정리했습니다.`);
        }

        async function loadMenuFromSession(sessionId) {
            const session = await getSession(sessionId);
            if (!session) return;

            document.getElementById('menuInput').value = session.menu.map(item => `${item.name}|${item.price}`).join('\n');
            document.getElementById('restaurantName').value = session.restaurant;
            hydrateOptionDraftsFromMenu(session.menu || []);
            refreshMenuBuilder();
            closeMenuModal();
        }

        async function showPreviousMenus() {
            const sessions = await getAllSessions();
            if (sessions.length === 0) {
                alert('이전에 만든 주문 세션이 없습니다.');
                return;
            }

            document.getElementById('modalTitle').textContent = '이전 메뉴 불러오기';
            document.getElementById('modalBody').innerHTML = `
                <div class="menu-select-list">
                    ${sessions.map(session => `
                        <div class="menu-select-item" onclick="loadMenuFromSession('${session.id}')">
                            <div>
                                <strong>${escapeHtml(session.restaurant)}</strong>
                                <p style="font-size: 0.9rem; color: #666;">${escapeHtml(session.name)} · ${new Date(session.createdAt).toLocaleString('ko-KR')}</p>
                            </div>
                            <div style="text-align: right; color: #999;">${session.menu.length}개 메뉴</div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('menuModal').style.display = 'flex';
        }

        function saveAsTemplate() {
            const restaurantName = document.getElementById('restaurantName').value.trim();
            const menuItems = parseMenuLines(document.getElementById('menuInput').value);

            if (!restaurantName || menuItems.length === 0) {
                alert('식당 이름과 메뉴를 먼저 입력해 주세요.');
                return;
            }

            saveTemplate({
                id: Date.now(),
                restaurantName,
                menu: menuItems.map(item => ({
                    name: item.name,
                    price: item.price,
                    options: buildMenuOptions(item.name)
                })),
                createdAt: new Date().toISOString()
            });

            alert(`"${restaurantName}" 템플릿을 저장했습니다.`);
        }

        function loadTemplate(templateId) {
            const template = getAllTemplates().find(item => item.id === templateId);
            if (!template) return;

            document.getElementById('menuInput').value = template.menu.map(item => `${item.name}|${item.price}`).join('\n');
            document.getElementById('restaurantName').value = template.restaurantName;
            hydrateOptionDraftsFromMenu(template.menu || []);
            refreshMenuBuilder();
            closeMenuModal();
        }

        function removeTemplate(templateId) {
            if (!confirm('이 템플릿을 삭제할까요?')) return;

            deleteTemplate(templateId);
            showTemplateModal();
        }

        function showTemplateModal() {
            const templates = getAllTemplates();
            if (templates.length === 0) {
                alert('저장된 템플릿이 없습니다.');
                return;
            }

            document.getElementById('modalTitle').textContent = '템플릿 불러오기';
            document.getElementById('modalBody').innerHTML = `
                <div class="menu-select-list">
                    ${templates.slice().reverse().map(template => `
                        <div class="menu-select-item">
                            <div onclick="loadTemplate(${template.id})" style="flex: 1; cursor: pointer;">
                                <strong>${escapeHtml(template.restaurantName)}</strong>
                                <p style="font-size: 0.9rem; color: #666;">${template.menu.length}개 메뉴 · ${new Date(template.createdAt).toLocaleDateString('ko-KR')}</p>
                            </div>
                            <button class="btn btn-small" style="background: #f44336; color: white;" onclick="removeTemplate(${template.id})">삭제</button>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('menuModal').style.display = 'flex';
        }

        function closeMenuModal() {
            document.getElementById('menuModal').style.display = 'none';
        }

        async function createSession() {
            const sessionName = document.getElementById('sessionName').value.trim();
            const restaurantName = document.getElementById('restaurantName').value.trim();
            const deadline = document.getElementById('deadline').value;
            const menuItems = parseMenuLines(document.getElementById('menuInput').value);

            if (!sessionName || !restaurantName || !deadline || menuItems.length === 0) {
                alert('세션 이름, 식당 이름, 마감 시간, 메뉴를 모두 입력해 주세요.');
                return;
            }

            const session = {
                id: generateSessionCode(),
                name: sessionName,
                restaurant: restaurantName,
                deadline,
                menu: menuItems.map(item => ({
                    id: `${Date.now()}-${Math.random()}`,
                    name: item.name,
                    price: item.price,
                    options: buildMenuOptions(item.name)
                })),
                orders: [],
                createdAt: new Date().toISOString()
            };

            await saveSession(session);
            location.href = `dashboard.html?session=${session.id}`;
        }

        async function loadSessions() {
            const sessions = await getAllSessions();
            const listDiv = document.getElementById('sessionList');

            if (sessions.length === 0) {
                listDiv.innerHTML = '<p class="empty">아직 생성한 주문 세션이 없습니다.</p>';
                return;
            }

            listDiv.innerHTML = `
                <div class="session-grid">
                    ${sessions.map(session => {
                        const deadline = new Date(session.deadline);
                        const expired = deadline < new Date();
                        return `
                            <div class="session-card ${expired ? 'expired' : 'active'}">
                                <div class="session-header">
                                    <h3>${escapeHtml(session.name)}</h3>
                                    <span class="status-badge ${expired ? 'expired' : 'active'}">${expired ? '마감' : '진행중'}</span>
                                </div>
                                <p class="restaurant">식당: ${escapeHtml(session.restaurant)}</p>
                                <p class="deadline">마감: ${deadline.toLocaleString('ko-KR')}</p>
                                <p class="order-count">${session.orders.length}명 주문</p>
                                <div class="session-actions">
                                    <button class="btn btn-small btn-secondary" onclick="copyLink('${session.id}')">링크 복사</button>
                                    <button class="btn btn-small btn-primary" onclick="location.href='dashboard.html?session=${session.id}'">대시보드</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function copyLink(sessionId) {
            let link;
            if (window.location.protocol === 'file:') {
                const currentPath = window.location.pathname;
                const dirPath = currentPath.substring(0, currentPath.lastIndexOf('/'));
                link = `file://${dirPath}/order.html?session=${sessionId}`;
            } else {
                const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                link = `${window.location.origin}${basePath}order.html?session=${sessionId}`;
            }

            navigator.clipboard.writeText(link).then(() => {
                alert('주문 링크를 복사했습니다.');
            });
        }

        async function exportData() {
            const sessions = await getAllSessions();
            const templates = getAllTemplates();
            const backupData = {
                version: '2.0',
                exportDate: new Date().toISOString(),
                sessions,
                templates
            };

            const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `menudamgi_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const text = await file.text();
                const backupData = JSON.parse(text);

                if (!Array.isArray(backupData.sessions)) {
                    throw new Error('올바른 백업 파일이 아닙니다.');
                }

                for (const session of backupData.sessions) {
                    const exists = await getSession(session.id);
                    if (!exists) {
                        await saveSession(session);
                    }
                }

                for (const template of backupData.templates || []) {
                    saveTemplate(template);
                }

                await loadSessions();
                alert('데이터 복원이 완료되었습니다.');
            } catch (error) {
                alert(`복원에 실패했습니다.\n${error.message}`);
            } finally {
                event.target.value = '';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setHours(17, 0, 0, 0);
            document.getElementById('deadline').value = now.toISOString().slice(0, 16);
            document.getElementById('menuInput').addEventListener('input', refreshMenuBuilder);
            loadSessions();
            refreshMenuBuilder();
        });

        window.onclick = function (event) {
            const modal = document.getElementById('menuModal');
            if (event.target === modal) {
                closeMenuModal();
            }
        };

        window.smartParse = smartParse;
        window.showPreviousMenus = showPreviousMenus;
        window.loadMenuFromSession = loadMenuFromSession;
        window.saveAsTemplate = saveAsTemplate;
        window.showTemplateModal = showTemplateModal;
        window.loadTemplate = loadTemplate;
        window.removeTemplate = removeTemplate;
        window.closeMenuModal = closeMenuModal;
        window.createSession = createSession;
        window.copyLink = copyLink;
        window.exportData = exportData;
        window.importData = importData;
        window.addOptionGroup = addOptionGroup;
        window.removeOptionGroup = removeOptionGroup;
        window.updateOptionGroupField = updateOptionGroupField;
    </script>
</body>
</html>
