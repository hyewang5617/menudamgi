<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 메뉴담기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 관리자 페이지</h1>
            <button class="btn btn-small" onclick="location.href='index.html'">홈으로</button>
        </header>

        <main>
            <!-- 새 주문 세션 만들기 -->
            <div class="card">
                <h2>새 주문 세션 만들기</h2>
                
                <div class="form-group">
                    <label>주문 이름 *</label>
                    <input type="text" id="sessionName" placeholder="예: 오늘 저녁, 금요일 디저트">
                </div>

                <div class="form-group">
                    <label>식당 이름 *</label>
                    <input type="text" id="restaurantName" placeholder="예: 맘스터치, 교촌치킨">
                </div>

                <div class="form-group">
                    <label>마감 시간 *</label>
                    <input type="datetime-local" id="deadline">
                </div>

                <div class="form-group">
                    <label>메뉴 입력 *</label>
                    <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
                        <button type="button" class="btn btn-small btn-secondary" onclick="showTemplateModal()">
                            📁 템플릿 불러오기
                        </button>
                        <button type="button" class="btn btn-small btn-secondary" onclick="showPreviousMenus()">
                            🔄 이전 메뉴 재사용
                        </button>
                        <button type="button" class="btn btn-small btn-secondary" onclick="saveAsTemplate()">
                            💾 템플릿으로 저장
                        </button>
                        <button type="button" class="btn btn-small btn-secondary" onclick="smartParse()">
                            🪄 자동 파싱
                        </button>
                    </div>
                    <p class="hint">한 줄에 하나씩, "메뉴명|가격" 또는 "메뉴명 가격" 형식으로 입력하세요</p>
                    <textarea id="menuInput" rows="10" placeholder="예시 1 (추천):
싸이버거|5900
통새우버거|6500
딥치즈버거|5500

예시 2 (자동 파싱):
싸이버거 5900원
통새우버거 6,500
딥치즈버거 5500"></textarea>
                </div>

                <div class="form-group">
                    <label>메뉴 미리보기</label>
                    <div id="menuPreview" class="menu-preview"></div>
                </div>

                <button class="btn btn-primary btn-large" onclick="createSession()">
                    주문 세션 생성하기
                </button>
            </div>

            <!-- 기존 세션 목록 -->
            <div class="card">
                <h2>내 주문 세션 목록</h2>
                <div id="sessionList"></div>
            </div>
        </main>
    </div>

    <!-- 템플릿/이전 메뉴 선택 모달 -->
    <div id="menuModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">메뉴 선택</h3>
                <button class="modal-close" onclick="closeMenuModal()">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 동적으로 채워짐 -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // ===== 메뉴 관리 기능 =====
        
        // 자동 파싱 - 다양한 형식 지원
        function smartParse() {
            const input = document.getElementById('menuInput').value.trim();
            if (!input) {
                alert('메뉴 텍스트를 먼저 입력해주세요!');
                return;
            }

            const lines = input.split('\n');
            const parsed = [];

            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                // 이미 올바른 형식이면 그대로
                if (line.includes('|')) {
                    parsed.push(line);
                    return;
                }

                // 다양한 패턴 매칭
                // "싸이버거 5900원" or "싸이버거 5,900원" or "싸이버거 5900"
                const patterns = [
                    /^(.+?)\s+([0-9,]+)원?\s*$/,  // "메뉴명 5900원" or "메뉴명 5900"
                    /^(.+?)\s*[:\-]\s*([0-9,]+)원?\s*$/,  // "메뉴명: 5900" or "메뉴명 - 5900"
                ];

                for (let pattern of patterns) {
                    const match = line.match(pattern);
                    if (match) {
                        const name = match[1].trim();
                        const price = match[2].replace(/,/g, '');
                        parsed.push(`${name}|${price}`);
                        return;
                    }
                }

                // 매칭 안 되면 경고
                console.warn('파싱 실패:', line);
            });

            if (parsed.length > 0) {
                document.getElementById('menuInput').value = parsed.join('\n');
                alert(`${parsed.length}개 메뉴가 파싱되었습니다!`);
            } else {
                alert('파싱할 수 있는 메뉴가 없습니다.\n\n올바른 형식:\n- 싸이버거|5900\n- 싸이버거 5900\n- 싸이버거 5900원');
            }
        }

        // 이전 메뉴 재사용
        function showPreviousMenus() {
            const sessions = getAllSessions();
            if (sessions.length === 0) {
                alert('이전 주문 세션이 없습니다.');
                return;
            }

            let html = '<div class="menu-select-list">';
            sessions.slice().reverse().forEach(session => {
                const date = new Date(session.createdAt).toLocaleString('ko-KR', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                html += `
                    <div class="menu-select-item" onclick="loadMenuFromSession('${session.id}')">
                        <div>
                            <strong>${session.restaurant}</strong>
                            <p style="font-size: 0.9rem; color: #666;">${session.name} - ${date}</p>
                        </div>
                        <div style="text-align: right; color: #999;">
                            ${session.menu.length}개 메뉴
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            document.getElementById('modalTitle').textContent = '이전 메뉴 불러오기';
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('menuModal').style.display = 'flex';
        }

        function loadMenuFromSession(sessionId) {
            const session = getSession(sessionId);
            if (!session) return;

            const menuText = session.menu.map(m => `${m.name}|${m.price}`).join('\n');
            document.getElementById('menuInput').value = menuText;
            document.getElementById('restaurantName').value = session.restaurant;
            
            closeMenuModal();
            alert(`"${session.restaurant}" 메뉴를 불러왔습니다!\n필요하면 수정하고 사용하세요.`);
        }

        // 템플릿 관리
        const TEMPLATE_KEY = 'menudamgi_templates';

        function getTemplates() {
            const data = localStorage.getItem(TEMPLATE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveTemplate(template) {
            const templates = getTemplates();
            templates.push(template);
            localStorage.setItem(TEMPLATE_KEY, JSON.stringify(templates));
        }

        function deleteTemplate(id) {
            const templates = getTemplates();
            const filtered = templates.filter(t => t.id !== id);
            localStorage.setItem(TEMPLATE_KEY, JSON.stringify(filtered));
        }

        function saveAsTemplate() {
            const restaurantName = document.getElementById('restaurantName').value.trim();
            const menuText = document.getElementById('menuInput').value.trim();

            if (!restaurantName || !menuText) {
                alert('식당 이름과 메뉴를 먼저 입력해주세요!');
                return;
            }

            const menuLines = menuText.split('\n').filter(line => line.trim());
            const menu = [];
            
            for (let line of menuLines) {
                const parts = line.split('|');
                if (parts.length === 2) {
                    menu.push({
                        name: parts[0].trim(),
                        price: parseInt(parts[1].trim())
                    });
                }
            }

            if (menu.length === 0) {
                alert('올바른 형식의 메뉴가 없습니다!');
                return;
            }

            const template = {
                id: Date.now(),
                restaurantName: restaurantName,
                menu: menu,
                createdAt: new Date().toISOString()
            };

            saveTemplate(template);
            alert(`"${restaurantName}" 템플릿이 저장되었습니다! 🎉`);
        }

        function showTemplateModal() {
            const templates = getTemplates();
            
            if (templates.length === 0) {
                alert('저장된 템플릿이 없습니다.\n\n먼저 메뉴를 입력하고 "템플릿으로 저장" 버튼을 눌러주세요!');
                return;
            }

            let html = '<div class="menu-select-list">';
            templates.slice().reverse().forEach(template => {
                const date = new Date(template.createdAt).toLocaleString('ko-KR', {
                    month: 'short',
                    day: 'numeric'
                });
                html += `
                    <div class="menu-select-item">
                        <div onclick="loadTemplate(${template.id})" style="flex: 1; cursor: pointer;">
                            <strong>${template.restaurantName}</strong>
                            <p style="font-size: 0.9rem; color: #666;">${template.menu.length}개 메뉴 - ${date}</p>
                        </div>
                        <button class="btn btn-small" style="background: #f44336; color: white;" onclick="removeTemplate(${template.id})">
                            삭제
                        </button>
                    </div>
                `;
            });
            html += '</div>';

            document.getElementById('modalTitle').textContent = '템플릿 불러오기';
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('menuModal').style.display = 'flex';
        }

        function loadTemplate(templateId) {
            const templates = getTemplates();
            const template = templates.find(t => t.id === templateId);
            if (!template) return;

            const menuText = template.menu.map(m => `${m.name}|${m.price}`).join('\n');
            document.getElementById('menuInput').value = menuText;
            document.getElementById('restaurantName').value = template.restaurantName;
            
            closeMenuModal();
            alert(`"${template.restaurantName}" 템플릿을 불러왔습니다!`);
        }

        function removeTemplate(templateId) {
            if (!confirm('이 템플릿을 삭제하시겠습니까?')) return;
            
            deleteTemplate(templateId);
            showTemplateModal(); // 모달 새로고침
        }

        function closeMenuModal() {
            document.getElementById('menuModal').style.display = 'none';
        }

        // 모달 외부 클릭시 닫기
        window.onclick = function(event) {
            const modal = document.getElementById('menuModal');
            if (event.target === modal) {
                closeMenuModal();
            }
        };

        // ===== 기존 코드 =====

        // 메뉴 입력 실시간 미리보기
        document.getElementById('menuInput').addEventListener('input', function() {
            const menuText = this.value;
            const preview = document.getElementById('menuPreview');
            const lines = menuText.split('\n').filter(line => line.trim());
            
            if (lines.length === 0) {
                preview.innerHTML = '<p class="empty">메뉴가 없습니다</p>';
                return;
            }

            let html = '<div class="menu-grid">';
            lines.forEach(line => {
                const parts = line.split('|');
                if (parts.length === 2) {
                    const name = parts[0].trim();
                    const price = parts[1].trim();
                    html += `
                        <div class="menu-item-preview">
                            <span class="menu-name">${name}</span>
                            <span class="menu-price">${parseInt(price).toLocaleString()}원</span>
                        </div>
                    `;
                }
            });
            html += '</div>';
            preview.innerHTML = html;
        });

        // 세션 생성
        function createSession() {
            const sessionName = document.getElementById('sessionName').value.trim();
            const restaurantName = document.getElementById('restaurantName').value.trim();
            const deadline = document.getElementById('deadline').value;
            const menuText = document.getElementById('menuInput').value.trim();

            if (!sessionName || !restaurantName || !deadline || !menuText) {
                alert('모든 필수 항목을 입력해주세요!');
                return;
            }

            // 메뉴 파싱
            const menuLines = menuText.split('\n').filter(line => line.trim());
            const menu = [];
            
            for (let line of menuLines) {
                const parts = line.split('|');
                if (parts.length === 2) {
                    menu.push({
                        id: Date.now() + Math.random(),
                        name: parts[0].trim(),
                        price: parseInt(parts[1].trim())
                    });
                }
            }

            if (menu.length === 0) {
                alert('올바른 형식의 메뉴를 최소 1개 이상 입력해주세요!');
                return;
            }

            // 세션 생성
            const session = {
                id: generateSessionCode(),
                name: sessionName,
                restaurant: restaurantName,
                deadline: deadline,
                menu: menu,
                orders: [],
                createdAt: new Date().toISOString()
            };

            // 저장
            saveSession(session);

            // 대시보드로 이동
            location.href = `dashboard.html?session=${session.id}`;
        }

        // 세션 목록 로드
        function loadSessions() {
            const sessions = getAllSessions();
            const listDiv = document.getElementById('sessionList');

            if (sessions.length === 0) {
                listDiv.innerHTML = '<p class="empty">아직 생성된 주문 세션이 없습니다.</p>';
                return;
            }

            let html = '<div class="session-grid">';
            sessions.forEach(session => {
                const deadline = new Date(session.deadline);
                const isExpired = deadline < new Date();
                const statusClass = isExpired ? 'expired' : 'active';
                const statusText = isExpired ? '마감됨' : '진행중';

                html += `
                    <div class="session-card ${statusClass}">
                        <div class="session-header">
                            <h3>${session.name}</h3>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <p class="restaurant">🍽️ ${session.restaurant}</p>
                        <p class="deadline">⏰ ${deadline.toLocaleString('ko-KR')}</p>
                        <p class="order-count">📋 ${session.orders.length}명 주문</p>
                        <div class="session-actions">
                            <button class="btn btn-small btn-secondary" onclick="copyLink('${session.id}')">
                                링크 복사
                            </button>
                            <button class="btn btn-small btn-primary" onclick="location.href='dashboard.html?session=${session.id}'">
                                대시보드
                            </button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            listDiv.innerHTML = html;
        }

        function copyLink(sessionId) {
            let link;
            if (window.location.protocol === 'file:') {
                // file:// 프로토콜이면 전체 경로 사용
                const currentPath = window.location.pathname;
                const dirPath = currentPath.substring(0, currentPath.lastIndexOf('/'));
                link = `file://${dirPath}/order.html?session=${sessionId}`;
            } else {
                // http:// 또는 https:// 프로토콜
                const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                link = `${window.location.origin}${basePath}order.html?session=${sessionId}`;
            }
            
            navigator.clipboard.writeText(link).then(() => {
                if (window.location.protocol === 'file:') {
                    alert('⚠️ 로컬 파일 모드입니다!\n\n링크가 복사되었지만, file:// 링크는 같은 컴퓨터에서만 작동합니다.\n\n팀원들과 공유하려면:\n1. GitHub Pages 배포 (추천!)\n2. 로컬 서버 실행 (http://localhost:8000)');
                } else {
                    alert('링크가 복사되었습니다!\n카톡으로 팀원들에게 공유하세요 📤');
                }
            });
        }

        // 페이지 로드시 세션 목록 로드
        loadSessions();

        // 기본 마감시간 설정 (오늘 오후 5시)
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setHours(17, 0, 0, 0);
            document.getElementById('deadline').value = now.toISOString().slice(0, 16);
        });
    </script>
</body>
</html>
