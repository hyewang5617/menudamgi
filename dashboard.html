<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 현황 - 메뉴담기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>주문 현황 대시보드</h1>
            <button class="btn btn-small" onclick="location.href='admin.html'">관리자 페이지</button>
        </header>

        <main id="dashboardMain">
            <div id="loading" class="loading">
                <p>주문 현황을 불러오는 중입니다...</p>
            </div>

            <div id="dashboard" style="display: none;">
                <div class="card session-info-card">
                    <h2 id="sessionTitle"></h2>
                    <p class="restaurant" id="restaurantName"></p>
                    <p class="deadline" id="deadlineInfo"></p>
                    <div class="session-stats">
                        <div class="stat-item">
                            <span class="stat-label">총 주문자</span>
                            <span class="stat-value" id="totalOrders">0명</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">총 금액</span>
                            <span class="stat-value" id="totalAmount">0원</span>
                        </div>
                    </div>
                    <div class="dashboard-actions">
                        <button class="btn btn-secondary" onclick="copyLink()">주문 링크 복사</button>
                        <button class="btn btn-primary" onclick="copyOrderSummary()">주문 내역 복사</button>
                    </div>
                </div>

                <div class="card">
                    <h3>메뉴별 집계</h3>
                    <div id="menuSummary" class="menu-summary"></div>
                </div>

                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;">
                        <h3 style="margin: 0;">개별 주문 내역 (<span id="orderCount">0</span>명)</h3>
                        <input type="text" id="searchName" placeholder="이름 검색" style="padding: 8px 12px; border: 2px solid #e0e0e0; border-radius: 8px; width: 220px;">
                    </div>
                    <div id="orderList" class="order-list"></div>
                </div>

                <div class="card">
                    <h3>복사용 주문 텍스트</h3>
                    <p class="hint">복사해서 메신저나 정산 메시지에 바로 붙여 넣을 수 있어요.</p>
                    <textarea id="orderText" class="order-text" readonly></textarea>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { getSession } from './firebase.js';

        let currentSession = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');

            if (!sessionId) {
                alert('세션 ID가 없습니다.');
                location.href = 'admin.html';
                return;
            }

            currentSession = await getSession(sessionId);
            if (!currentSession) {
                alert('세션을 찾을 수 없습니다.');
                location.href = 'admin.html';
                return;
            }

            displayDashboard();

            const searchInput = document.getElementById('searchName');
            searchInput.addEventListener('input', (event) => {
                displayOrderList(event.target.value);
            });
        });

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatOptionSummary(item) {
            if (!item.selectedOptions || item.selectedOptions.length === 0) {
                return '';
            }

            return item.selectedOptions
                .map(group => `${group.groupName}: ${group.choices.map(choice => choice.name).join(', ')}`)
                .join(' / ');
        }

        function getLineTotal(item) {
            if (typeof item.unitPrice === 'number') {
                return item.unitPrice * item.quantity;
            }

            if (typeof item.optionUnitPrice === 'number') {
                return (item.price + item.optionUnitPrice) * item.quantity;
            }

            return item.price * item.quantity;
        }

        function displayDashboard() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';

            document.getElementById('sessionTitle').textContent = currentSession.name;
            document.getElementById('restaurantName').textContent = `식당: ${currentSession.restaurant}`;

            const deadline = new Date(currentSession.deadline);
            const isExpired = deadline < new Date();
            document.getElementById('deadlineInfo').textContent = `${isExpired ? '마감됨' : '마감'}: ${deadline.toLocaleString('ko-KR')}`;

            const totalOrders = currentSession.orders.length;
            const totalAmount = currentSession.orders.reduce((sum, order) => sum + order.totalPrice, 0);

            document.getElementById('totalOrders').textContent = `${totalOrders}명`;
            document.getElementById('totalAmount').textContent = `${totalAmount.toLocaleString()}원`;

            displayMenuSummary();
            displayOrderList(document.getElementById('searchName')?.value || '');
            generateOrderText();
        }

        function displayMenuSummary() {
            const menuSummaryDiv = document.getElementById('menuSummary');

            if (currentSession.orders.length === 0) {
                menuSummaryDiv.innerHTML = '<p class="empty">아직 주문이 없습니다</p>';
                return;
            }

            const menuCount = {};
            currentSession.orders.forEach(order => {
                order.items.forEach(item => {
                    if (!menuCount[item.menuName]) {
                        menuCount[item.menuName] = {
                            name: item.menuName,
                            quantity: 0,
                            amount: 0
                        };
                    }

                    menuCount[item.menuName].quantity += item.quantity;
                    menuCount[item.menuName].amount += getLineTotal(item);
                });
            });

            const sortedMenu = Object.values(menuCount).sort((a, b) => b.quantity - a.quantity);

            menuSummaryDiv.innerHTML = `
                <div class="summary-grid">
                    ${sortedMenu.map(item => `
                        <div class="summary-card">
                            <div class="summary-name">${escapeHtml(item.name)}</div>
                            <div class="summary-quantity">${item.quantity}개</div>
                            <div class="summary-price">${item.amount.toLocaleString()}원</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function displayOrderList(searchTerm = '') {
            const orderListDiv = document.getElementById('orderList');
            const orderCountSpan = document.getElementById('orderCount');

            if (currentSession.orders.length === 0) {
                orderListDiv.innerHTML = '<p class="empty">아직 주문이 없습니다</p>';
                orderCountSpan.textContent = '0';
                return;
            }

            let filteredOrders = currentSession.orders;
            if (searchTerm) {
                filteredOrders = currentSession.orders.filter(order =>
                    order.userName.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            orderCountSpan.textContent = String(currentSession.orders.length);

            if (filteredOrders.length === 0) {
                orderListDiv.innerHTML = '<p class="empty">검색 결과가 없습니다</p>';
                return;
            }

            orderListDiv.innerHTML = filteredOrders.map(order => {
                const timestamp = new Date(order.timestamp).toLocaleString('ko-KR', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                let displayName = escapeHtml(order.userName);
                if (searchTerm) {
                    const regex = new RegExp(`(${searchTerm})`, 'gi');
                    displayName = displayName.replace(regex, '<mark style="background: #ffeb3b; padding: 2px 4px; border-radius: 3px;">$1</mark>');
                }

                return `
                    <div class="order-card" data-name="${escapeHtml(order.userName.toLowerCase())}">
                        <div class="order-header">
                            <h4>${displayName}</h4>
                            <span class="order-time">${timestamp}</span>
                        </div>
                        <div class="order-items">
                            ${order.items.map(item => `
                                <div class="order-item">
                                    <div>
                                        <span><strong>${escapeHtml(item.menuName)}</strong> x ${item.quantity}</span>
                                        ${formatOptionSummary(item) ? `<div class="summary-item-options">${escapeHtml(formatOptionSummary(item))}</div>` : ''}
                                    </div>
                                    <span style="color: #4CAF50; font-weight: 600;">${getLineTotal(item).toLocaleString()}원</span>
                                </div>
                            `).join('')}
                        </div>
                        ${order.note ? `<div class="order-note">요청: ${escapeHtml(order.note)}</div>` : ''}
                        <div class="order-total">
                            <strong>합계: ${order.totalPrice.toLocaleString()}원</strong>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function generateOrderText() {
            const textarea = document.getElementById('orderText');

            if (currentSession.orders.length === 0) {
                textarea.value = '아직 주문이 없습니다.';
                return;
            }

            let text = `[${currentSession.name}]\n`;
            text += `${currentSession.restaurant}\n`;
            text += `마감: ${new Date(currentSession.deadline).toLocaleString('ko-KR')}\n\n`;
            text += '=== 메뉴별 주문 ===\n';

            const menuCount = {};
            currentSession.orders.forEach(order => {
                order.items.forEach(item => {
                    if (!menuCount[item.menuName]) {
                        menuCount[item.menuName] = 0;
                    }
                    menuCount[item.menuName] += item.quantity;
                });
            });

            Object.keys(menuCount).sort().forEach(menuName => {
                text += `${menuName}: ${menuCount[menuName]}개\n`;
            });

            text += '\n=== 개별 주문 ===\n';
            currentSession.orders.forEach(order => {
                text += `\n${order.userName}:\n`;
                order.items.forEach(item => {
                    text += `  - ${item.menuName} x ${item.quantity}`;
                    const optionText = formatOptionSummary(item);
                    if (optionText) {
                        text += ` (${optionText})`;
                    }
                    text += `\n`;
                });
                if (order.note) {
                    text += `  요청: ${order.note}\n`;
                }
                text += `  합계: ${order.totalPrice.toLocaleString()}원\n`;
            });

            const totalAmount = currentSession.orders.reduce((sum, order) => sum + order.totalPrice, 0);
            text += `\n총 인원: ${currentSession.orders.length}명\n`;
            text += `총 금액: ${totalAmount.toLocaleString()}원`;

            textarea.value = text;
        }

        function copyLink() {
            let link;
            if (window.location.protocol === 'file:') {
                const currentPath = window.location.pathname;
                const dirPath = currentPath.substring(0, currentPath.lastIndexOf('/'));
                link = `file://${dirPath}/order.html?session=${currentSession.id}`;
            } else {
                const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                link = `${window.location.origin}${basePath}order.html?session=${currentSession.id}`;
            }

            navigator.clipboard.writeText(link).then(() => {
                alert('주문 링크를 복사했습니다.');
            });
        }

        function copyOrderSummary() {
            const textarea = document.getElementById('orderText');
            textarea.select();
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert('주문 내역을 복사했습니다.');
            });
        }

        setInterval(async () => {
            if (!currentSession?.id) return;

            const updatedSession = await getSession(currentSession.id);
            if (!updatedSession) return;

            currentSession = updatedSession;
            displayDashboard();
        }, 30000);

        window.copyLink = copyLink;
        window.copyOrderSummary = copyOrderSummary;
    </script>
</body>
</html>
